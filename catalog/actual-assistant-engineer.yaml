name: actual-assistant-engineer
repo: https://github.com/somewheresy/actual-assistant-engineer
sha: 0000000000000000000000000000000000000000
subdir: plugin/actual-assistant-engineer
description: >-
  Operate Ableton Live from Hermes as an assistant engineer: create and save Sets, build
  instruments and effect racks, write and arrange MIDI, automate clip and arrangement lanes,
  sidechain and mix, work inside VST3 plug-ins, and gate on track completeness. Disclosure —
  macOS uses an owner-only Unix socket; Windows uses authenticated IPv4 loopback with
  protected current-user key/discovery files. Setup copies a bundled Live control surface
  into the User Library. Writes Sets and a profile-scoped cache. Runs osascript/open on
  macOS and process-scoped UI Automation/Live executable on Windows, never global keystrokes.
  An offline pedalboard host loads VSTs; uv may provision Python/packages for Windows UIA
  or architecture-matched VST hosting. No account credentials required.
maintainer: somewheresy
tier: community
category: tools
docs_url: https://github.com/somewheresy/actual-assistant-engineer/tree/main/plugin/actual-assistant-engineer#readme
version: "0.3.0"
platforms: [macos, windows]
requires_hermes: ">=0.21"
capabilities:
  provides_tools: [live_set, live_vst, live_arrangement_automation, live_inspect, live_ops, live_browse, live_review, live_analyze]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
